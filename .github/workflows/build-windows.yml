name: Build ReCap Server (Windows)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Drop superseded expensive builds when a newer commit lands on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          pacboy: gcc:p cmake:p make:p

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.30'

      - name: Set up NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up Git
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git

      - name: Configure
        run: |
          cd darkspore_server
          export PATH=/c/Users/runneradmin/nasm:$PATH
          cmake . -B build -G "Visual Studio 17 2022" -DCMAKE_PREFIX_PATH="C:\\hostedtoolcache\\windows\\perl\\5.30.3-thr\\x64\\bin" -DCMAKE_INSTALL_PREFIX=./dist

      - name: Build
        run: |
          cd darkspore_server/build
          export PATH=/c/Users/runneradmin/nasm:$PATH
          cmake --build . --config Release --parallel 2
          cmake -DCOMPONENT=recap_server -Pcmake_install.cmake

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Headless game APIs and registration persistence
        shell: pwsh
        run: |
          python tests/headless_server_smoke.py --server darkspore_server/dist/bin/recap_server.exe --data darkspore_server/res/data

      - name: Smoke test command-line entry point
        run: |
          cd darkspore_server
          ./dist/bin/recap_server.exe --version
          ./dist/bin/recap_server.exe --help
          if ./dist/bin/recap_server.exe --darkspore-path; then
            echo "Expected missing --darkspore-path to fail" >&2
            exit 1
          fi

      - name: Adding needed files
        run: |
          cd darkspore_server
          cp -r res/data dist/bin/data
          mkdir -p dist/bin/storage/user
          touch dist/bin/storage/user/PLACEHOLDER

      - uses: actions/upload-artifact@v4
        with:
          name: recap-server-windows-x64
          path: ${{ github.workspace }}/darkspore_server/dist
