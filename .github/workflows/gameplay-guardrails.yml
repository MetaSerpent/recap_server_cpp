name: Gameplay guardrails (standalone)

on:
  push:
  pull_request:

# Drop superseded expensive builds when a newer commit lands on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ability-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated gameplay tests
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/ability_selection_test.cpp -o /tmp/ability_selection_test
      - name: Run isolated gameplay tests
        run: /tmp/ability_selection_test
      - name: Compile and run cooldown math tests
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/cooldown_math_test.cpp -o /tmp/cooldown_math_test
          /tmp/cooldown_math_test
      - name: Compile and test enemy AI gambit selection
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/ai_gambit_selection_test.cpp -o /tmp/ai_gambit_selection_test
          /tmp/ai_gambit_selection_test
      - name: Compile and test mission progression
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/mission_progression_test.cpp -o /tmp/mission_progression_test
          /tmp/mission_progression_test
      - name: Compile and test objective medal packing
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/mission_results_test.cpp -o /tmp/mission_results_test
          /tmp/mission_results_test
      - name: Compile and test original mission timing medals
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/objective_scoring_test.cpp -o /tmp/objective_scoring_test
          /tmp/objective_scoring_test
      - name: Compile and test enemy-clear objective
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/enemy_clear_tracker_test.cpp -o /tmp/enemy_clear_tracker_test
          /tmp/enemy_clear_tracker_test
      - name: Compile and test token encoding
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/auth_token_test.cpp -o /tmp/auth_token_test
          /tmp/auth_token_test
      - name: Compile and test squad input parsing
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/squad_selection_test.cpp -o /tmp/squad_selection_test
          /tmp/squad_selection_test
      - name: Compile and test account file identifiers
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/account_filename_test.cpp -o /tmp/account_filename_test
          /tmp/account_filename_test
      - name: Check squad-skill dispatch contract
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
