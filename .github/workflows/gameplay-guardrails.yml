name: Gameplay guardrails (standalone)

on:
  push:
  pull_request:

# Drop superseded expensive builds when a newer commit lands on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ability-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated gameplay tests
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/ability_selection_test.cpp -o /tmp/ability_selection_test
      - name: Run isolated gameplay tests
        run: /tmp/ability_selection_test
      - name: Compile and run cooldown math tests
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/cooldown_math_test.cpp -o /tmp/cooldown_math_test
          /tmp/cooldown_math_test
      - name: Compile and test enemy AI gambit selection
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/ai_gambit_selection_test.cpp -o /tmp/ai_gambit_selection_test
          /tmp/ai_gambit_selection_test
      - name: Compile and test mission progression
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/mission_progression_test.cpp -o /tmp/mission_progression_test
          /tmp/mission_progression_test
      - name: Compile and test objective medal packing
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/mission_results_test.cpp -o /tmp/mission_results_test
          /tmp/mission_results_test
      - name: Compile and test cash-out reward planning
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/cashout_rewards_test.cpp -o /tmp/cashout_rewards_test
          /tmp/cashout_rewards_test
      - name: Compile and test original mission timing medals
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/objective_scoring_test.cpp -o /tmp/objective_scoring_test
          /tmp/objective_scoring_test
      - name: Compile and test enemy-clear objective
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/enemy_clear_tracker_test.cpp -o /tmp/enemy_clear_tracker_test
          /tmp/enemy_clear_tracker_test
      - name: Compile and test damage objective scoring
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/damage_objectives_test.cpp -o /tmp/damage_objectives_test
          /tmp/damage_objectives_test
      - name: Compile and test token encoding
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/auth_token_test.cpp -o /tmp/auth_token_test
          /tmp/auth_token_test
      - name: Compile and test squad input parsing
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/squad_selection_test.cpp -o /tmp/squad_selection_test
          /tmp/squad_selection_test
      - name: Compile and test account file identifiers
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/account_filename_test.cpp -o /tmp/account_filename_test
          /tmp/account_filename_test
      - name: Transpile redistributable Lua 5.1 fixture and execute it with LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/lua51_transpiler_test.cpp -o /tmp/lua51_transpiler_test
          /tmp/lua51_transpiler_test tests/fixtures/lua51 /tmp/transpiler_fixture.lua
          luajit tests/fixtures/lua51/run_fixture.lua /tmp/transpiler_fixture.lua /tmp/transpiler_fixture.out
          diff -u tests/fixtures/lua51/transpiler_fixture.expected /tmp/transpiler_fixture.out
      - name: Resolve Darkspore Group!name.lua modules with the server require shim
        run: luajit tests/require_shim_test.lua
      - name: Register game abilities with the server binding (sol2 + LuaJIT)
        run: |
          git clone -q https://github.com/LuaJIT/LuaJIT.git /tmp/luajit
          git -C /tmp/luajit checkout -q ea9eb7edb5eac4a9d175d74523db34fac0fa5180
          make -s -C /tmp/luajit/src libluajit.a -j4
          git clone -q --depth 1 --branch v3.3.1 https://github.com/ThePhD/sol2.git /tmp/sol2
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic -DSOL_LUAJIT=1 -DSOL_SAFE_FUNCTION_CALLS=1 -DSOL_SAFE_USERTYPE=1 -DSOL_EXCEPTIONS_SAFE_PROPAGATION=1             -isystem /tmp/sol2/include -isystem /tmp/luajit/src tests/ability_registration_test.cpp /tmp/luajit/src/libluajit.a -ldl -lm             -o /tmp/ability_registration_test
          /tmp/ability_registration_test
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic -DSOL_LUAJIT=1 -DSOL_SAFE_FUNCTION_CALLS=1 -DSOL_SAFE_USERTYPE=1 -DSOL_EXCEPTIONS_SAFE_PROPAGATION=1             -isystem /tmp/sol2/include -isystem /tmp/luajit/src tests/lua_thread_recovery_test.cpp /tmp/luajit/src/libluajit.a -ldl -lm             -o /tmp/lua_thread_recovery_test
          /tmp/lua_thread_recovery_test
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic -DSOL_LUAJIT=1 -DSOL_SAFE_FUNCTION_CALLS=1 -DSOL_SAFE_USERTYPE=1 -DSOL_EXCEPTIONS_SAFE_PROPAGATION=1 -DSOL_STRINGS_ARE_NUMBERS=1             -isystem /tmp/sol2/include -isystem /tmp/luajit/src tests/combat_call_test.cpp /tmp/luajit/src/libluajit.a -ldl -lm             -o /tmp/combat_call_test
          /tmp/combat_call_test
          # Release configuration (-O2 -DNDEBUG): sol2 checks argument types there only
          # with SOL_SAFE_FUNCTION_CALLS, the same defines as darkspore_server/CMakeLists.txt.
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic -O2 -DNDEBUG -DSOL_STRINGS_ARE_NUMBERS=1 -DSOL_SAFE_FUNCTION_CALLS=1 -DSOL_SAFE_USERTYPE=1 -DSOL_LUAJIT=1 -DSOL_EXCEPTIONS_SAFE_PROPAGATION=1             -isystem /tmp/sol2/include -isystem /tmp/luajit/src tests/lua_type_filter_test.cpp /tmp/luajit/src/libluajit.a -ldl -lm             -o /tmp/lua_type_filter_test
          /tmp/lua_type_filter_test
      - name: Animation sequence cursor and attribute modifier handles
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/combat_presentation_test.cpp -o /tmp/combat_presentation_test
          /tmp/combat_presentation_test
      - name: Build-103 action response layout and team validation
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/action_response_test.cpp -o /tmp/action_response_test
          /tmp/action_response_test
      - name: Squads reference owned creatures, not templates
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic tests/squad_repair_test.cpp -o /tmp/squad_repair_test
          /tmp/squad_repair_test
      - name: Campaign level order from ChainLevels game data
        run: |
          git clone -q --depth 1 --branch v1.15 https://github.com/zeux/pugixml.git /tmp/pugixml
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic -I/tmp/pugixml/src tests/chain_levels_test.cpp /tmp/pugixml/src/pugixml.cpp -o /tmp/chain_levels_test
          /tmp/chain_levels_test tests/fixtures/chainlevels
      - name: Redact credentials from Blaze packet logs
        run: |
          git clone -q https://github.com/Tencent/rapidjson.git /tmp/rapidjson
          git -C /tmp/rapidjson checkout -q ebd87cb468fb4cb060b37e579718c4a4125416c1
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic -DRAPIDJSON_HAS_STDSTRING -I/tmp/rapidjson/include -Idarkspore_server/source \
            tests/blaze_log_redaction_test.cpp darkspore_server/source/blaze/tdf.cpp darkspore_server/source/databuffer.cpp \
            -o /tmp/blaze_log_redaction_test
          /tmp/blaze_log_redaction_test
      - name: Check squad-skill dispatch contract
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
